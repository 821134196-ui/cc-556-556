# HTTP
quarkus.http.port=8080

# SQLite via Hibernate community dialect
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:data/cleaning.db
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

# Recreate schema on every boot (demo project; seed data restores examples)
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Jackson：时间字段在后端统一格式化为字符串
quarkus.jackson.serialization-inclusion=non-null

# Serve the built Svelte bundle from static resources
quarkus.http.enable-compression=true
