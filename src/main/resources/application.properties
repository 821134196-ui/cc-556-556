quarkus.http.port=8080
quarkus.rest.path=/api

# ---- SQLite 数据源（本地文件，无需额外服务） ----
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:data/housekeep.db
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=10S

# ---- Hibernate / SQLite 社区方言 ----
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

quarkus.log.category."com.example.hk".level=INFO
quarkus.http.access-log.enabled=false
